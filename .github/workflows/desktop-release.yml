name: Desktop apps (Pake)

# Собирает десктоп-обёртки кошелька через Pake (Tauri) для Windows, macOS и Linux.
#
# Источник — тот же standalone-билд, что уходит в Pages: php minify.php собирает
# ОДИН самодостаточный html (ассеты вшиты data-URI). Его и упаковываем (--use-local-file):
#   1) приложение работает без интернета и не зависит от доступности Pages;
#   2) локальный origin не попадает под гейт Local Network Access (Chromium 138+ режет
#      https → 127.0.0.1), поэтому кошелёк в десктопе может ходить в ноду пользователя.
#
# Иконка в системном трее: --show-system-tray + --system-tray-icon (Windows/macOS/Linux).
#
# Триггеры: ручной запуск и публикация релиза (тогда сборки прикрепляются к релизу).
# Ручному запуску можно передать тег: тогда собираем код этого тега и докладываем файлы в его
# релиз — так добирается платформа, чья сборка упала (перезапуск джобы берёт старую версию
# workflow, а повторно публиковать релиз ради одного установщика не хочется).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза: собрать его код и прикрепить файлы к этому релизу'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # WebKitGTK — движок Tauri на Linux; libayatana-appindicator — БЕЗ неё нет иконки в трее.
      - name: Linux build deps
        if: matrix.label == 'linux'
        # Без noninteractive apt может встать на интерактивном запросе и висеть до таймаута
        # джобы — ловил такое залипание на 27 минут при том, что соседний раннер тот же шаг
        # проходил штатно.
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 20
        run: |
          # Раннер тянет пакеты с azure.archive.ubuntu.com, и когда это зеркало молчит, apt
          # ретраит его по кругу до таймаута джобы (19.08 так упали linux-сборки обоих десктоп-
          # репозиториев). Переписываем зеркало на канонический archive.ubuntu.com и ограничиваем
          # ожидание, чтобы отвал зеркала стоил секунд, а не всей сборки.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update
          $apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file libssl-dev build-essential curl wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: pake-${{ matrix.label }}

      - name: Build standalone wallet (minify.php)
        shell: bash
        run: |
          php minify.php > /dev/null
          mkdir -p dist
          cp wallet-viz-world-portable.html dist/index.html
          test -s dist/index.html

      # Иконка приложения: Windows требует .ico, macOS — .icns, Linux берёт .png.
      - name: Prepare icons
        shell: bash
        run: |
          mkdir -p build
          cp desktop/tray.png build/tray.png
          case "${{ matrix.label }}" in
            windows) cp desktop/icon.ico build/icon.ico ;;
            linux)   cp desktop/icon.png build/icon.png ;;
            macos)
              mkdir -p build/icon.iconset
              for s in 16 32 64 128 256 512; do
                sips -z $s $s desktop/icon.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
              done
              cp desktop/icon.png build/icon.iconset/icon_512x512@2x.png
              iconutil -c icns build/icon.iconset -o build/icon.icns
              ;;
          esac

      - name: Install pake-cli
        run: npm install -g pake-cli

      - name: Build desktop app
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            windows) ICON=build/icon.ico ;;
            macos)   ICON=build/icon.icns ;;
            *)       ICON=build/icon.png ;;
          esac
          pake ./dist \
            --name "VIZ Wallet" \
            --icon "$ICON" \
            --use-local-file \
            --show-system-tray \
            --system-tray-icon build/tray.png \
            --width 1100 \
            --height 820

      # Pake прописывает в .desktop собственную заглушку: Name=viz-wallet и Comment «Turn any
      # webpage into a desktop app with Rust», а Categories оставляет пустым. В меню приложений
      # это выглядит чужой программой без раздела — переписываем на свои значения.
      # AppImage несёт такой же .desktop внутри, но его правка требует пересборки образа — не трогаем.
      - name: Polish Linux desktop entry
        if: matrix.label == 'linux'
        shell: bash
        run: |
          deb=$(ls *.deb)
          tmp=$(mktemp -d)
          dpkg-deb -R "$deb" "$tmp"
          for f in "$tmp"/usr/share/applications/*.desktop; do
            sed -i -e 's/^Name=.*/Name=VIZ Wallet/' \
                   -e 's|^Comment=.*|Comment=Non-custodial VIZ wallet|' \
                   -e 's/^Categories=.*/Categories=Network;Finance;/' "$f"
          done
          dpkg-deb -b "$tmp" "$deb"
          grep -h '^\(Name\|Comment\|Categories\)=' "$tmp"/usr/share/applications/*.desktop

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          # Pake кладёт установщик в текущую директорию; расширение зависит от платформы.
          find . -maxdepth 2 \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -not -path './node_modules/*' -not -path './out/*' -exec cp {} out/ \;
          ls -la out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@v4
        with:
          name: viz-wallet-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: out/*
